name: Scheduled platform regression

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-unit-tests:
    name: iOS unit tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Run iOS unit tests
        run: >-
          xcodebuild test
          -project ios/Hanco/Hanco.xcodeproj
          -scheme Hanco
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'

  android-instrumentation:
    name: Android instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Install emulator image
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' \
            'emulator' \
            'system-images;android-35;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name piyokey-ci-api35 \
            --package 'system-images;android-35;google_apis;x86_64'
      - name: Start emulator
        run: |
          "$ANDROID_HOME/emulator/emulator" \
            -avd piyokey-ci-api35 \
            -no-window \
            -gpu swiftshader_indirect \
            -noaudio \
            -no-boot-anim &
          adb wait-for-device
          until [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; do
            sleep 2
          done
          adb shell input keyevent 82
      - name: Run connected Android tests
        working-directory: android
        run: >-
          ./gradlew
          :core:data:connectedDebugAndroidTest
          :feature:practice:connectedDebugAndroidTest
          :app:connectedDebugAndroidTest
          --no-daemon
