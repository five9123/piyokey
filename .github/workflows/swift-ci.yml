name: Swift contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/swift-ci.yml'
      - 'ios/HangulEngine/**'
      - 'shared/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/swift-ci.yml'
      - 'ios/HangulEngine/**'
      - 'shared/**'
  workflow_dispatch:

concurrency:
  group: swift-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-contracts:
    name: Swift shared engine
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test HangulEngine and DeckKit
        working-directory: ios/HangulEngine
        run: swift test
