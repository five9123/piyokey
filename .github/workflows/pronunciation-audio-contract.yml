name: Pronunciation audio contract

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'shared/mock_catalog/**'
      - 'tools/**'
      - 'ios/Hanco/Hanco/**'
      - 'AGENTS.md'
      - 'PRD.md'
      - 'DECISIONS.md'

jobs:
  release-preflight:
    name: Verify offline pronunciation asset contract
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Validate pronunciation catalog contract
        run: python3 tools/release_preflight.py
