name: Python and release contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'DECISIONS.md'
      - 'PRD.md'
      - 'ios/**'
      - 'release/**'
      - 'shared/**'
      - 'tools/**'
      - 'web/analytics/**'
  push:
    branches:
      - main
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'DECISIONS.md'
      - 'PRD.md'
      - 'ios/**'
      - 'release/**'
      - 'shared/**'
      - 'tools/**'
      - 'web/analytics/**'
  workflow_dispatch:

concurrency:
  group: source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-contracts:
    name: Python tools and content contracts
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Run tool tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Verify deterministic PiyoDeck goldens
        run: |
          python3 tools/gen_piyodeck_fixtures.py
          git diff --exit-code -- shared/piyodeck/fixtures
      - name: Verify release contracts
        run: python3 tools/release_preflight.py
