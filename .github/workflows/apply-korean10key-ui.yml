name: Apply Korean 10-key practice UI

on:
  push:
    branches:
      - codex/issue-11-korean-10-key

permissions:
  contents: write

jobs:
  patch-practice-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Korean 10-key UI and practice eligibility gate
        env:
          KEYBOARD_SWIFT_GZIP_BASE64: 
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          keyboard = Path("ios/Hanco/Hanco/Features/Practice/HangulKeyboardView.swift")
          keyboard.write_bytes(
              gzip.decompress(base64.b64decode(os.environ["KEYBOARD_SWIFT_GZIP_BASE64"]))
          )

          practice = Path("ios/Hanco/Hanco/Features/Practice/PracticeView.swift")
          text = practice.read_text()
          needle = """            hapticsEnabled: hapticsEnabled
          ),
          onInputStart: recordInputStart,
"""
          replacement = """            hapticsEnabled: hapticsEnabled
          ),
          allowsKorean10Key: allowsOSKeyboard,
          onInputStart: recordInputStart,
"""
          if replacement not in text:
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f"Expected one PracticeView insertion point, found {count}")
              practice.write_text(text.replace(needle, replacement, 1))

          Path(".github/workflows/apply-korean10key-ui.yml").unlink()
          PY

      - name: Commit scoped source updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/Hanco/Hanco/Features/Practice/HangulKeyboardView.swift \
            ios/Hanco/Hanco/Features/Practice/PracticeView.swift \
            .github/workflows/apply-korean10key-ui.yml
          git commit -m "feat(ios): add Korean 10-key practice keyboard"
          git push origin "HEAD:${GITHUB_REF_NAME}"
